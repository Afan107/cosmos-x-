    <script>
      // Gracefully suppress Vite HMR WebSocket connection drops in sandboxed iframe / Cloud Run proxies
      (function() {
        function isWsError(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return str.includes('websocket') || str.includes('failed to connect to websocket');
        }
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || reason)) || '';
          if (isWsError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = (event.message || '') + ' ' + (event.filename || '');
          if (isWsError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
